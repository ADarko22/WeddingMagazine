before_you_come:
  heading: "Prima di Partire"
  intro: |-
    Alcune piccole cose ci aiutano a offrirvi la giornata migliore. Se potete condividerle in anticipo, al resto pensiamo noi.
  checklist_title: "Fatecelo sapere"
  checklist:
    - "*Esigenze alimentari e allergie* — vegetariano, vegano, senza glutine o qualsiasi allergia, così la cucina potrà prendersi cura di voi."
    - "*Accessibilità e supporto speciale* — accesso senza scale, sedute o qualsiasi cosa renda la giornata più semplice."
    - "*Accompagnatori e bambini* — confermate chi viene e le eventuali necessità di seggioloni o menù per bambini."
    - "*Date del viaggio* — indicativamente quando arrivate e ripartite, nel caso possiamo aiutarvi a organizzarvi."
  rsvp_title: "Conferma di Partecipazione"
  rsvp_body: |-
    Vi preghiamo di rispondere entro il *1 aprile 2028*. Confermate e condividete i dettagli qui sopra a « link o email », oppure contattateci direttamente — siamo sempre felici di aiutare.

